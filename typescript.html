<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TypeScript</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --navy: #1e3d6b;
      --navy-deep: #0f2240;
      --navy-mid: #2a5294;
      --teal: #0f9d8e;
      --teal-dark: #0b7c71;
      --gold: #f0b429;
      --coral: #e4543c;
      --line: #d5deea;
      --ink: #152036;
      --muted: #5a6b80;
      --header-h: 68px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: var(--font);
      color: var(--ink);
    }

    body {
      background:
        radial-gradient(1100px 460px at 8% -8%, rgba(15, 157, 142, 0.16), transparent 55%),
        radial-gradient(900px 380px at 100% 0%, rgba(228, 84, 60, 0.12), transparent 48%),
        linear-gradient(180deg, #eaf0f8 0%, #f7f4ec 100%);
    }

    body.modal-open { overflow: hidden; }

    :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: linear-gradient(115deg, #0f2240 0%, #1e3d6b 58%, #1a4f78 100%);
      color: #fff;
      box-shadow: 0 8px 24px rgba(15, 34, 64, 0.28);
    }

    .site-header::after {
      content: "";
      display: block;
      height: 3px;
      background: linear-gradient(90deg, var(--coral), var(--gold), var(--teal));
    }

    .header-inner {
      width: min(1280px, calc(100% - 28px));
      margin: 0 auto;
      min-height: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.2rem;
    }

    .brand-mark { display: flex; }
    .brand-logo { display: block; width: 34px; height: 34px; border-radius: 8px; }
    .brand-text span { color: var(--gold); }

    .nav-toggle {
      display: none;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: transparent;
      border-radius: 8px;
      cursor: pointer;
      padding: 10px 9px;
    }

    .nav-toggle-bar {
      display: block;
      height: 2px;
      background: #fff;
      margin: 5px 0;
    }

    .site-nav {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav-link, .dropdown-trigger {
      color: rgba(255, 255, 255, 0.86);
      text-decoration: none;
      background: none;
      border: 0;
      font: inherit;
      cursor: pointer;
      padding: 8px 11px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .nav-link:hover, .dropdown-trigger:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .nav-link.is-active {
      background: rgba(240, 180, 41, 0.22);
      color: var(--gold);
    }

    .caret {
      display: inline-block;
      width: 0;
      height: 0;
      margin-left: 6px;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid currentColor;
      vertical-align: middle;
    }

    .dropdown { position: relative; }

    .dropdown-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      min-width: 230px;
      margin: 0;
      padding: 8px;
      list-style: none;
      background: #fff;
      color: var(--ink);
      border-radius: 10px;
      box-shadow: 0 14px 34px rgba(15, 34, 64, 0.12);
      border: 1px solid var(--line);
      z-index: 80;
    }

    .dropdown-menu a, .dropdown-menu button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 9px 10px;
      border: 0;
      background: none;
      font: inherit;
      color: inherit;
      text-decoration: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .dropdown-menu a:hover, .dropdown-menu button:hover {
      background: #e7f6f3;
      color: var(--navy);
    }

    .container {
      width: min(1100px, calc(100% - 32px));
      margin: 24px auto 40px;
    }

    .page-header h1 {
      margin: 0 0 6px;
      font-size: 1.6rem;
      color: var(--navy);
    }

    .page-header p {
      margin: 0;
      color: var(--muted);
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 18px 0;
    }

    .controls input[type=text],
    .controls select,
    .controls button {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      color: inherit;
      font: inherit;
      min-width: 220px;
    }

    .controls button {
      min-width: auto;
      background: linear-gradient(180deg, #17b3a3, var(--teal));
      color: #fff;
      border-color: var(--teal);
      font-weight: 700;
      cursor: pointer;
    }

    .controls button:hover { background: var(--teal-dark); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }

    .card {
      background: #fff;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      box-shadow: 0 10px 24px rgba(15, 34, 64, 0.08);
      transition: transform .14s ease, box-shadow .14s;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 32px rgba(15, 34, 64, 0.14);
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .num {
      font-weight: 700;
      background: #eaf2fb;
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--navy);
    }

    .cat {
      font-size: 12px;
      padding: 6px 8px;
      border-radius: 999px;
      font-weight: 600;
    }

    .cat.basic {
      background: #e6f4f2;
      color: var(--teal-dark);
    }

    .cat.intermediate {
      background: #fff4d6;
      color: #8a6a12;
    }

    .cat.advanced {
      background: #fde8e8;
      color: #9b2c2c;
    }

    .title { margin: 0 0 8px; color: var(--navy); }

    .desc { color: var(--muted); margin: 0; }

    h3, h4 { margin-top: 0; }

    .page-footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
    }

    .site-footer {
      padding: 18px 16px;
      text-align: center;
      color: rgba(255, 255, 255, 0.78);
      background: linear-gradient(180deg, #163056, #0f2240);
    }

    .site-footer a { color: var(--gold); }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .modal.is-open { display: flex; }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(15, 34, 64, 0.55);
    }

    .modal-dialog {
      position: relative;
      width: min(860px, 100%);
      max-height: calc(100vh - 48px);
      overflow: auto;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 20px 50px rgba(15, 34, 64, 0.28);
      z-index: 1;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      background: #fff;
    }

    .modal-title {
      margin: 0;
      font-size: 1.15rem;
      color: var(--navy);
    }

    .modal-close {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 8px;
      background: #eaf2fb;
      color: var(--navy);
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
    }

    .modal-body {
      padding: 18px 20px 24px;
      line-height: 1.55;
    }

    .modal-body pre {
      background: #0f2240;
      color: #e6f7f4;
      padding: 12px;
      border-radius: 8px;
      overflow: auto;
    }

    .modal-body code {
      font-family: Consolas, "Courier New", monospace;
    }

    .modal-body p code,
    .modal-body li code,
    .modal-body h5 code {
      background: #eaf2fb;
      color: var(--navy);
      padding: 1px 5px;
      border-radius: 4px;
    }

    .modal-body pre code {
      background: none;
      color: inherit;
      padding: 0;
    }

    .modal-body a { color: var(--teal-dark); }

    @media (max-width: 860px) {
      .nav-toggle { display: block; }
      .site-nav {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        top: 100%;
        background: #10243f;
        flex-direction: column;
        align-items: stretch;
        padding: 10px;
        z-index: 90;
      }
      .header-inner { position: relative; }
      .site-nav.is-open { display: flex; }
      .dropdown-menu { position: static; box-shadow: none; }
    }
  </style>
</head>
<body>
  <header class="site-header" id="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html#home" aria-label="BuildCV home">
        <img class="brand-logo" src="assets/favicon.svg" width="34" height="34" alt="">
        <span class="brand-text">Build<span>CV</span></span>
      </a>
      <button class="nav-toggle" type="button" id="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Primary">
        <a class="nav-link" href="index.html#home">Home</a>
        <a class="nav-link" href="index.html#get-my-cv">Get My CV</a>
        <a class="nav-link" href="index.html#build-json">Build CV Using JSON</a>
        <a class="nav-link" href="index.html#javascript-compiler">Javascript Online Compiler</a>
        <div class="dropdown" id="interview-dropdown">
          <button class="nav-link dropdown-trigger" type="button" id="interview-trigger" aria-expanded="false" aria-haspopup="true" aria-controls="interview-menu">
            Interview Preparation <span class="caret" aria-hidden="true"></span>
          </button>
          <ul class="dropdown-menu" id="interview-menu" role="menu" hidden>
            <li role="none"><a role="menuitem" href="quiz.html">React &amp; Beyond Quiz</a></li>
            <li role="none"><a role="menuitem" href="typescript.html" aria-current="page">TypeScript</a></li>
            <li role="none"><a role="menuitem" href="python.pdf">Python</a></li>
            <li role="none"><a role="menuitem" href="fastapi.pdf">FastAPI</a></li>
            <li role="none"><button role="menuitem" type="button" id="java-coming-soon">Java</button></li>
          </ul>
        </div>
        <a class="nav-link" href="index.html#about">About</a>
        <a class="nav-link" href="cvEditor.html">CV Editor</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <header class="page-header">
      <div>
        <h1>TypeScript Topics</h1>
        <p>Use search or filter to find a topic.</p>
      </div>
    </header>

    <div class="controls">
      <input id="search" type="text" placeholder="Search topics..." />
      <select id="filter">
        <option value="all">All categories</option>
        <option value="Basic">Basic</option>
        <option value="Intermediate">Intermediate</option>
        <option value="Advanced">Advanced</option>
      </select>
      <button id="reset" type="button">Reset</button>
    </div>

    <div id="grid" class="grid"></div>

    <footer class="page-footer">Showing <span id="count">0</span> of 75 topics</footer>
  </div>

  <div id="topicModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-dialog">
      <div class="modal-header">
        <h4 class="modal-title" id="modalTitle"></h4>
        <button type="button" class="modal-close" data-close-modal aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <footer class="site-footer">
    <a href="mailto:buildcv.co.in@zohomail.in">📧 buildcv.co.in@zohomail.in</a>
  </footer>

  <script src="js/tsContent.js"></script>
  <script>
    const topics = [
      { n: 1, title: 'Setup and Hello World', cat: 'Basic' },
      { n: 2, title: 'Primitive Types', cat: 'Basic' },
      { n: 3, title: 'Instance Types', cat: 'Basic' },
      { n: 4, title: 'Arrays And Tuples', cat: 'Basic' },
      { n: 5, title: 'Object Types and Type Aliases', cat: 'Basic' },
      { n: 6, title: 'const declarations', cat: 'Basic' },
      { n: 7, title: 'Functions', cat: 'Basic' },
      { n: 8, title: 'Structural Typing', cat: 'Basic' },
      { n: 9, title: 'Classes', cat: 'Basic' },
      { n: 10, title: 'Target Compiler Option', cat: 'Basic' },
      { n: 11, title: 'Generics', cat: 'Basic' },
      { n: 12, title: 'Special Types : any and unknown', cat: 'Basic' },
      { n: 13, title: 'JavaScript to TypeScript', cat: 'Basic' },
      { n: 14, title: 'Creating a Frontend Project', cat: 'Basic' },
      { n: 15, title: 'Type Assertions', cat: 'Basic' },
      { n: 16, title: 'Type Casting', cat: 'Basic' },
      { n: 17, title: 'Modules', cat: 'Basic' },
      { n: 18, title: 'Type Declarations', cat: 'Basic' },
      { n: 19, title: 'Creating an NPM Package', cat: 'Basic' },
      { n: 20, title: 'Async Await', cat: 'Basic' },
      { n: 21, title: 'ts-node', cat: 'Basic' },
      { n: 22, title: 'Lexical this', cat: 'Basic' },
      { n: 23, title: 'readonly modifier', cat: 'Basic' },
      { n: 24, title: 'Union Types', cat: 'Basic' },
      { n: 25, title: 'Literal Types', cat: 'Basic' },
      { n: 26, title: 'Type Narrowing', cat: 'Basic' },
      { n: 27, title: 'Discriminated Unions', cat: 'Basic' },
      { n: 28, title: 'Class Parameter Properties', cat: 'Basic' },
      { n: 29, title: 'Strict Compiler Option', cat: 'Basic' },
      { n: 30, title: 'Null versus Undefined', cat: 'Basic' },
      { n: 31, title: 'Intersection types', cat: 'Intermediate' },
      { n: 32, title: 'Optional modifier', cat: 'Intermediate' },
      { n: 33, title: 'Non-null Assertion Operator', cat: 'Intermediate' },
      { n: 34, title: 'Interfaces', cat: 'Intermediate' },
      { n: 35, title: 'Interface Declaration Merging', cat: 'Intermediate' },
      { n: 36, title: 'Types versus Interfaces', cat: 'Intermediate' },
      { n: 37, title: 'never type', cat: 'Intermediate' },
      { n: 38, title: 'implements keyword', cat: 'Intermediate' },
      { n: 39, title: 'Definite Assignment Assertion', cat: 'Intermediate' },
      { n: 40, title: 'User Defined Type Guards', cat: 'Intermediate' },
      { n: 41, title: 'Assertion Functions', cat: 'Intermediate' },
      { n: 42, title: 'Function Overloading', cat: 'Intermediate' },
      { n: 43, title: 'Call Signatures', cat: 'Intermediate' },
      { n: 44, title: 'Abstract Classes', cat: 'Intermediate' },
      { n: 45, title: 'Index Signatures', cat: 'Intermediate' },
      { n: 46, title: 'Readonly Arrays and Tuples', cat: 'Intermediate' },
      { n: 47, title: 'Double Assertion', cat: 'Intermediate' },
      { n: 48, title: 'const Assertion', cat: 'Intermediate' },
      { n: 49, title: 'this parameter', cat: 'Intermediate' },
      { n: 50, title: 'Generic Constraints', cat: 'Intermediate' },
      { n: 51, title: 'Dealing with Temporal Uncertainty', cat: 'Intermediate' },
      { n: 52, title: 'typeof type operator', cat: 'Intermediate' },
      { n: 53, title: 'Lookup Types', cat: 'Intermediate' },
      { n: 54, title: 'keyof type operator', cat: 'Intermediate' },
      { n: 55, title: 'Conditional Types', cat: 'Intermediate' },
      { n: 56, title: 'Conditional Types with Unions and never', cat: 'Intermediate' },
      { n: 57, title: 'infer keyword and ReturnType<T>', cat: 'Intermediate' },
      { n: 58, title: 'Mapped Types', cat: 'Intermediate' },
      { n: 59, title: 'Mapped type modifiers', cat: 'Intermediate' },
      { n: 60, title: 'Template Literal Type', cat: 'Intermediate' },
      { n: 61, title: 'Partial<T>', cat: 'Advanced' },
      { n: 62, title: 'Required<T>', cat: 'Advanced' },
      { n: 63, title: 'Readonly<T>', cat: 'Advanced' },
      { n: 64, title: 'Record<K,V>', cat: 'Advanced' },
      { n: 65, title: 'AutoComplete Literal Unions with Primitives', cat: 'Advanced' },
      { n: 66, title: 'Project References', cat: 'Advanced' },
      { n: 67, title: 'undefined vs optional', cat: 'Advanced' },
      { n: 68, title: 'satisfies operator', cat: 'Advanced' },
      { n: 69, title: 'PropertyKey', cat: 'Advanced' },
      { n: 70, title: 'ThisType<T> Utility', cat: 'Advanced' },
      { n: 71, title: 'Awaited<T> Utility', cat: 'Advanced' },
      { n: 72, title: 'String Manipulation Utilities', cat: 'Advanced' },
      { n: 73, title: 'Mapped Types as Clauses', cat: 'Advanced' },
      { n: 74, title: 'TypeScript Unions vs Intersection Mental Model', cat: 'Advanced' },
      { n: 75, title: 'TypeScript Enums are Bad', cat: 'Advanced' }
    ];
    //#region Topic Contents
   let topicContent = getTSContent();

    //#endregion  


    const grid = document.getElementById('grid');
    const countEl = document.getElementById('count');
    const search = document.getElementById('search');
    const filter = document.getElementById('filter');
    const reset = document.getElementById('reset');
    const modal = document.getElementById('topicModal');

    function render(list) {
      grid.innerHTML = '';
      list.forEach(t => {
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `
          <div class="meta">
            <div class="num">#${t.n}</div>
            <div class="cat ${t.cat.toLowerCase()}">${t.cat}</div>
          </div>
          <h4 class="title">${t.title}</h4>
          <p class="desc">Click to read full notes</p>

        `;
        card.onclick = () => openModal(t);
        grid.appendChild(card);
      });
      countEl.textContent = list.length;
    }

    function applyFilters() {
      const q = search.value.trim().toLowerCase();
      const cat = filter.value;
      const out = topics.filter(t => {
        const matchCat = cat === 'all' || t.cat === cat;
        const matchQ = q === '' || t.title.toLowerCase().includes(q) || String(t.n).includes(q);
        return matchCat && matchQ;
      });
      render(out);
    }

    function openModal(topic) {
      document.getElementById('modalTitle').textContent = `#${topic.n} — ${topic.title}`;
      document.getElementById('modalBody').innerHTML = topicContent[topic.n] || `<p>Content not available yet.</p>`;
      modal.hidden = false;
      modal.classList.add('is-open');
      document.body.classList.add('modal-open');
      var dialog = modal.querySelector('.modal-dialog');
      if (dialog) dialog.scrollTop = 0;
      modal.querySelector('.modal-close').focus();
    }

    function closeModal() {
      modal.classList.remove('is-open');
      modal.hidden = true;
      document.body.classList.remove('modal-open');
    }

    modal.addEventListener('click', function (event) {
      if (event.target.hasAttribute('data-close-modal')) closeModal();
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && modal.classList.contains('is-open')) closeModal();
    });

    search.addEventListener('input', applyFilters);
    filter.addEventListener('change', applyFilters);
    reset.addEventListener('click', () => { search.value = ''; filter.value = 'all'; applyFilters(); });

    var nav = document.getElementById('site-nav');
    var toggle = document.getElementById('nav-toggle');
    toggle.addEventListener('click', function () {
      var open = !nav.classList.contains('is-open');
      nav.classList.toggle('is-open', open);
      toggle.setAttribute('aria-expanded', String(open));
    });

    var interviewMenu = document.getElementById('interview-menu');
    var interviewTrigger = document.getElementById('interview-trigger');
    interviewTrigger.addEventListener('click', function (event) {
      event.stopPropagation();
      interviewMenu.hidden = !interviewMenu.hidden;
      interviewTrigger.setAttribute('aria-expanded', String(!interviewMenu.hidden));
    });
    document.addEventListener('click', function (event) {
      if (!document.getElementById('interview-dropdown').contains(event.target)) {
        interviewMenu.hidden = true;
        interviewTrigger.setAttribute('aria-expanded', 'false');
      }
    });
    document.getElementById('java-coming-soon').addEventListener('click', function () {
      window.alert('Java interview preparation is coming soon!');
      interviewMenu.hidden = true;
    });

    render(topics);
  </script>
</body>
</html>
